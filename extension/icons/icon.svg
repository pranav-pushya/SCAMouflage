      <stop offset="0%" stop-color="#2F4454" />
      <stop offset="100%" stop-color="#1C3334" />
    </linearGradient>
    <linearGradient id="hausGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DA7B93" />
      <stop offset="100%" stop-color="#376E6F" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="128" height="128" rx="28" fill="#1C3334" />
  
  <!-- Outer Shield Path -->
